<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Páginas de links · estudos</title>
<style>
  :root { --bg:#f6f5f2; --fg:#151515; --muted:#6b6b6b; --line:#e2e0da; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#f2f2f2; --muted:#9a9a9a; --line:#2a2a2a; --card:#1a1a1a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:56px 16px; }
  h1 { font-size:28px; margin:0 0 4px; letter-spacing:-.02em; }
  p { color:var(--muted); margin:0 0 32px; }
  a.item { display:flex; justify-content:space-between; align-items:center; padding:18px 20px; margin-bottom:10px;
    background:var(--card); border:1px solid var(--line); border-radius:14px; color:inherit; text-decoration:none; font-weight:600; }
  a.item:hover { border-color:var(--fg); }
  a.item span { color:var(--muted); font-weight:400; }
  footer { margin-top:32px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Páginas de links</h1>
  <p>Estudos de redesign não oficiais por @rafael.takehara</p>
  <a class="item" href="cerbasi/">Gustavo Cerbasi <span>→</span></a>
  <a class="item" href="joel-jota/">Joel Jota <span>→</span></a>
  <a class="item" href="rildo-lasmar/">Rildo Lasmar <span>→</span></a>
  <footer>Conceitos de design, sem vínculo com as pessoas citadas.</footer>
</main>
</body>
</html>
